<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Çark-ı Matematik</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            overflow: hidden; 
        }
        
        .container { 
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; width: 90%; max-width: 480px; 
            position: relative; 
        }

        h1 { color: #2c3e50; margin-bottom: 15px; font-size: clamp(28px, 8vw, 38px); }
        
        .level-subtitle {
            color: #34495e;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 25px;
            font-size: clamp(15px, 4.5vw, 19px); 
            display: block;
        }

        .btn-redirect-main, .btn-close {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background-color: #ff4d4d; color: white; text-decoration: none; border: none; border-radius: 50%;
            cursor: pointer; font-size: 20px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); line-height: 1; z-index: 100; padding: 0;
        }
        .btn-redirect-main:hover, .btn-close:hover { background-color: #ff0000; transform: scale(1.1); }
        
        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px;}
        .btn-level { 
            background-color: #9b59b6; color: white; padding: 15px 0; font-size: 22px; margin: 0;
            border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .btn-level:hover { background-color: #8e44ad; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.15);}
        
        .hidden { display: none !important; }

        #score-board { 
            margin-bottom: 15px; margin-top: 35px; background: #f8f9fa; padding: 15px; 
            padding-right: 50px; border-radius: 15px; display: flex; flex-direction: column;
            gap: 8px; position: relative; border: 2px solid #ecf0f1;
            cursor: pointer; transition: background-color 0.2s ease;
        }
        #score-board:hover { background-color: #e9ecef; }
        #score-board:hover .btn-inspect { color: #9b59b6; }
        
        .main-stats { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .sub-stats { font-size: 15px; font-weight: bold; display: flex; justify-content: center; gap: 8px; align-items: center;}
        
        .stat-correct { color: #27ae60; }
        .stat-wrong { color: #e74c3c; }
        .stat-divider { color: #bdc3c7; }

        .btn-inspect {
            position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
            display: flex; flex-direction: column;
            align-items: center; font-size: 12px; font-weight: bold; color: #2c3e50; transition: 0.2s; padding: 0;
        }
        .btn-inspect span { font-size: 24px; margin-bottom: 2px; }

        .game-area {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .question-box {
            position: relative;
            background: #fff;
            padding: 10px 30px;
            font-size: 42px;
            font-weight: 900;
            color: #2c3e50;
            border: 4px solid #7f8c8d;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            z-index: 2;
            transition: all 0.3s ease;
        }

        .question-box.correct { background-color: #95d5b2; border-color: #27ae60; }
        .question-box.correct .pointer { border-top-color: #27ae60; }
        .question-box.correct .pointer::after { border-top-color: #95d5b2; }

        .question-box.wrong { background-color: #f5b7b1; border-color: #e74c3c; }
        .question-box.wrong .pointer { border-top-color: #e74c3c; }
        .question-box.wrong .pointer::after { border-top-color: #f5b7b1; }

        .pointer {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #7f8c8d;
            z-index: 5;
            transition: border-color 0.3s ease;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: -24px;
            left: -11px;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 15px solid #fff;
            transition: border-color 0.3s ease;
        }

        .wheel-container {
            width: 280px;
            height: 140px; 
            overflow: hidden;
            position: relative;
            margin: 0 auto;
            border-bottom: 4px solid #7f8c8d;
        }

        .wheel {
            width: 280px;
            height: 280px; 
            border-radius: 50%;
            border: 4px solid #7f8c8d;
            background: #f8f9fa;
            position: absolute;
            top: 0; left: 0;
            box-sizing: border-box;
            touch-action: none; 
            transform-origin: center center;
            overflow: hidden; /* Kenar taşmalarını garanti engeller */
        }

        /* Çizgiler için yeni bağımsız ızgara sınıfı */
        .wheel-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(to right, transparent calc(50% - 2px), #7f8c8d calc(50% - 2px), #7f8c8d calc(50% + 2px), transparent calc(50% + 2px)),
                linear-gradient(to bottom, transparent calc(50% - 2px), #7f8c8d calc(50% - 2px), #7f8c8d calc(50% + 2px), transparent calc(50% + 2px));
            pointer-events: none; /* Tıklamaları engellemez */
            z-index: 5;
            border-radius: 50%;
        }

        .slice {
            position: absolute;
            width: 140px; 
            height: 140px;
            cursor: pointer;
            transition: background-color 0.3s;
            /* Kenarlıklar tamamen kaldırıldı, çizimi wheel-lines yapacak */
        }

        .left-slice { top: 0; left: 0; border-top-left-radius: 140px; }
        .right-slice { top: 0; right: 0; border-top-right-radius: 140px; }
        .bottom-left-slice { bottom: 0; left: 0; border-bottom-left-radius: 140px; }
        .bottom-right-slice { bottom: 0; right: 0; border-bottom-right-radius: 140px; }

        .center-pin {
            position: absolute;
            top: 126px; 
            left: 126px;
            width: 20px;
            height: 20px;
            background: #2c3e50;
            border-radius: 50%;
            z-index: 10;
        }

        .slice-text {
            font-size: 38px;
            font-weight: 900;
            color: #2c3e50;
            position: absolute;
            line-height: 1;
            z-index: 2;
        }
        
        .left-slice .slice-text { bottom: 55px; right: 55px; transform: translate(50%, 50%); }
        .right-slice .slice-text { bottom: 55px; left: 55px; transform: translate(-50%, 50%); }
        .bottom-left-slice .slice-text { top: 55px; right: 55px; transform: translate(50%, -50%); }
        .bottom-right-slice .slice-text { top: 55px; left: 55px; transform: translate(-50%, -50%); }

        #message { height: 30px; font-weight: bold; margin-top: 15px; font-size: 24px; transition: 0.3s; color: #34495e; }

        .table-list {
            display: flex; justify-content: space-between; gap: 15px;
            margin-top: 15px; padding: 15px; background: #f8f9fa;
            border-radius: 15px; border: 2px solid #ecf0f1;
        }
        .table-column { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .table-row { font-size: 17px; font-weight: bold; padding-bottom: 5px; border-bottom: 1px dashed #ddd; text-align: left; white-space: nowrap; }
        .row-correct { color: #27ae60; }
        .row-wrong { color: #e74c3c; }
        .row-unanswered { color: #7f8c8d; }

        .btn-mistakes {
            background-color: #e67e22; color: white; padding: 15px; font-size: 20px;
            border: none; border-radius: 10px; cursor: pointer; font-weight: bold;
            width: 100%; margin-top: 15px; transition: 0.3s;
        }
        .btn-mistakes:hover { background-color: #d35400; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(230, 126, 34, 0.4); }

        @media (max-width: 480px) {
            .container { padding: 20px 10px; width: 95%; }
            .wheel-container { width: 260px; height: 130px; }
            .wheel { width: 260px; height: 260px; }
            .slice { width: 130px; height: 130px; }
            .left-slice { border-top-left-radius: 130px; }
            .right-slice { border-top-right-radius: 130px; }
            .bottom-left-slice { border-bottom-left-radius: 130px; }
            .bottom-right-slice { border-bottom-right-radius: 130px; }
            .center-pin { top: 116px; left: 116px; }
            .question-box { font-size: 36px; padding: 10px 25px; }
            .slice-text { font-size: 34px; }
            .left-slice .slice-text { bottom: 50px; right: 50px; }
            .right-slice .slice-text { bottom: 50px; left: 50px; }
            .bottom-left-slice .slice-text { top: 50px; right: 50px; }
            .bottom-right-slice .slice-text { top: 50px; left: 50px; }
        }

    </style>
</head>
<body>

<div id="level-screen" class="container">
    <a href="https://matfabe.com/oyunlar/" class="btn-redirect-main">×</a>
    <h1>🎡 Çark-ı Matematik</h1>
    <p class="level-subtitle">Kaçların Çarpımını Öğrenmek İstersin?<br>Seç ve Başla!</p>
    <div class="level-grid" id="levels"></div>
</div>

<div id="game-screen" class="container hidden">
    <button class="btn-close" onclick="endGame()">×</button>
    
    <div id="score-board" onclick="openInspectScreen()">
        <div class="main-stats">Skor: <span id="score-display">0</span> | Seviye: <span id="level-display">6</span><span id="level-suffix">'lar</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="count-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="count-wrong">0</span></span>
        </div>
        <div class="btn-inspect">
            <span>🔍</span>
            İncele
        </div>
    </div>

    <div class="game-area">
        <div class="question-box" id="q-box">
            <span id="question-text">5 x 4</span>
            <div class="pointer"></div>
        </div>

        <div class="wheel-container">
            <div class="wheel" id="wheel">
                <div class="slice left-slice" id="slice-left">
                    <span class="slice-text" id="slice-left-text">30</span>
                </div>
                <div class="slice right-slice" id="slice-right">
                    <span class="slice-text" id="slice-right-text">20</span>
                </div>
                <div class="slice bottom-left-slice" id="slice-bottom-left">
                    <span class="slice-text" id="slice-bottom-left-text">15</span>
                </div>
                <div class="slice bottom-right-slice" id="slice-bottom-right">
                    <span class="slice-text" id="slice-bottom-right-text">45</span>
                </div>
                
                <div class="wheel-lines"></div>
                
                <div class="center-pin"></div>
            </div>
        </div>
    </div>

    <p id="message">Çarkı doğru cevaba döndür!</p>
</div>

<div id="inspect-screen" class="container hidden">
    <button class="btn-close" onclick="closeInspectScreen()">×</button>
    
    <div id="score-board" style="padding-right: 15px; cursor: default;">
        <div class="main-stats">Skor: <span id="insp-score">0</span></div>
        <div class="sub-stats">
            <span class="stat-correct">✔ Doğru: <span id="insp-correct">0</span></span>
            <span class="stat-divider">|</span>
            <span class="stat-wrong">✖ Yanlış: <span id="insp-wrong">0</span></span>
        </div>
    </div>

    <h2 style="color: #2c3e50; margin: 10px 0;"><span id="insp-level-title">6</span><span id="insp-level-suffix">'lar</span> Çarpım Tablosu</h2>
    <div id="table-list" class="table-list"></div>
    <button class="btn-mistakes" onclick="startMistakeMode()">Sadece Yanlışlara Çalış</button>
</div>

<script>
    let currentLevel = 1;      
    let correctMultiplier = 1; 
    let correctSide = 'left';

    let isChecking = false; 
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let historyData = {}; 

    let isMistakeMode = false;
    let mistakeQueue = [];
    let needsNewQuestion = false;

    function showScreen(screenId) {
        document.getElementById('level-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('inspect-screen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    function generateLevelButtons() {
        const levelsDiv = document.getElementById('levels');
        levelsDiv.innerHTML = ""; 
        for (let i = 1; i <= 9; i++) {
            let btn = document.createElement('button');
            let suffix = [1, 2, 3, 4, 5, 7, 8].includes(i) ? "'ler" : "'lar";
            btn.innerText = i + suffix;
            btn.className = "btn-level";
            btn.onclick = () => startLevel(i);
            levelsDiv.appendChild(btn);
        }
    }
    window.onload = generateLevelButtons;

    function startLevel(level) {
        currentLevel = level;
        document.getElementById('level-display').innerText = level;
        
        let suffix = [1, 2, 3, 4, 5, 7, 8].includes(level) ? "'ler" : "'lar";
        document.getElementById('level-suffix').innerText = suffix;
        document.getElementById('insp-level-title').innerText = level;
        document.getElementById('insp-level-suffix').innerText = suffix;
        
        isMistakeMode = false;
        mistakeQueue = [];
        score = 0; correctCount = 0; wrongCount = 0;
        historyData = {}; 
        updateScoreBoard();

        showScreen('game-screen');
        generateQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('score-display').innerText = score;
        document.getElementById('count-correct').innerText = correctCount;
        document.getElementById('count-wrong').innerText = wrongCount;
    }

    function generateQuestion() {
        isChecking = false;
        const msgBox = document.getElementById('message');
        msgBox.innerText = "Çarkı doğru cevaba döndür!";
        msgBox.style.color = "#34495e";
        
        document.getElementById('q-box').classList.remove('correct', 'wrong');

        const wheelEl = document.getElementById('wheel');
        wheelEl.style.transition = 'none';
        wheelEl.style.transform = `rotate(0deg)`;
        
        document.getElementById('slice-left').style.backgroundColor = 'transparent';
        document.getElementById('slice-right').style.backgroundColor = 'transparent';

        if (isMistakeMode) {
            const randomIndex = Math.floor(Math.random() * mistakeQueue.length);
            correctMultiplier = mistakeQueue[randomIndex];
        } else {
            correctMultiplier = Math.floor(Math.random() * 10) + 1; 
        }

        let result = currentLevel * correctMultiplier;

        let wrongMultiplier = correctMultiplier + (Math.random() > 0.5 ? 1 : -1);
        if (wrongMultiplier < 1) wrongMultiplier = correctMultiplier + 2;
        if (wrongMultiplier > 10) wrongMultiplier = correctMultiplier - 2;
        let wrongResult = currentLevel * wrongMultiplier;

        correctSide = Math.random() > 0.5 ? 'left' : 'right';

        document.getElementById('question-text').innerText = `${currentLevel} x ${correctMultiplier}`;

        if (correctSide === 'left') {
            document.getElementById('slice-left-text').innerText = result;
            document.getElementById('slice-right-text').innerText = wrongResult;
        } else {
            document.getElementById('slice-left-text').innerText = wrongResult;
            document.getElementById('slice-right-text').innerText = result;
        }

        document.getElementById('slice-bottom-left-text').innerText = Math.floor(Math.random() * 90) + 10;
        document.getElementById('slice-bottom-right-text').innerText = Math.floor(Math.random() * 90) + 10;
    }

    function selectAnswer(side) {
        if(isChecking) return;
        isChecking = true;
        
        let isCorrect = (side === correctSide);
        let targetRot = side === 'left' ? 45 : -45;
        
        const wheelEl = document.getElementById('wheel');
        wheelEl.style.transition = 'transform 0.4s cubic-bezier(0.25, 1.5, 0.5, 1)';
        wheelEl.style.transform = `rotate(${targetRot}deg)`;
        
        let sliceBgId = side === 'left' ? 'slice-left' : 'slice-right';
        const qBox = document.getElementById('q-box');
        
        setTimeout(() => {
            if (isCorrect) {
                document.getElementById(sliceBgId).style.backgroundColor = '#95d5b2';
                qBox.classList.add('correct');
                document.getElementById('message').innerText = "Tebrikler! Doğru 🎉";
                document.getElementById('message').style.color = "#27ae60";
                handleCorrectAnswerLogic();
            } else {
                document.getElementById(sliceBgId).style.backgroundColor = '#f5b7b1';
                qBox.classList.add('wrong');
                document.getElementById('message').innerText = "Maalesef Yanlış! ❌";
                document.getElementById('message').style.color = "#e74c3c";
                handleWrongAnswerLogic();
            }
        }, 400); 
    }

    function handleCorrectAnswerLogic() {
        score += 10;
        if (isMistakeMode) {
            historyData[correctMultiplier] = 'correct';
            if (wrongCount > 0) wrongCount--;
            correctCount++;
            updateScoreBoard();

            mistakeQueue = mistakeQueue.filter(m => m !== correctMultiplier);
            
            if (mistakeQueue.length === 0) {
                setTimeout(() => {
                    alert("Tebrikler! Tüm yanlışlarını öğrendin. 🎉");
                    isMistakeMode = false;
                    needsNewQuestion = true; 
                    openInspectScreen(); 
                }, 1000);
                return;
            }
        } else {
            correctCount++;
            updateScoreBoard();
            if(historyData[correctMultiplier] !== 'wrong') {
                historyData[correctMultiplier] = 'correct';
            }
        }
        setTimeout(() => { generateQuestion(); }, 1200);
    }

    function handleWrongAnswerLogic() {
        wrongCount++;
        updateScoreBoard();
        historyData[correctMultiplier] = 'wrong';
        setTimeout(() => { generateQuestion(); }, 1400); 
    }

    document.getElementById('slice-left').onclick = () => selectAnswer('left');
    document.getElementById('slice-right').onclick = () => selectAnswer('right');

    let currentRot = 0;
    let startX = 0;
    let dragging = false;
    const wheelEl = document.getElementById('wheel');

    function startDrag(e) {
        if (isChecking) return;
        dragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        wheelEl.style.transition = 'none';
    }

    function moveDrag(e) {
        if (!dragging) return;
        if (e.cancelable) e.preventDefault(); 
        let currentX = e.touches ? e.touches[0].clientX : e.clientX;
        let diffX = currentX - startX;
        currentRot = diffX * 0.4; 
        
        if(currentRot > 60) currentRot = 60;
        if(currentRot < -60) currentRot = -60;
        
        wheelEl.style.transform = `rotate(${currentRot}deg)`;
    }

    function endDrag() {
        if (!dragging) return;
        dragging = false;
        
        if (currentRot > 20) {
            selectAnswer('left');
        } else if (currentRot < -20) {
            selectAnswer('right');
        } else {
            wheelEl.style.transition = 'transform 0.3s ease-out';
            wheelEl.style.transform = `rotate(0deg)`;
        }
        currentRot = 0;
    }

    wheelEl.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', endDrag);

    wheelEl.addEventListener('touchstart', startDrag, {passive: false});
    wheelEl.addEventListener('touchmove', moveDrag, {passive: false});
    wheelEl.addEventListener('touchend', endDrag);

    function endGame() {
        if (isMistakeMode) {
            isMistakeMode = false;
            openInspectScreen(); 
        } else {
            if(confirm("Oyunu bitirmek ve seviye seçimine dönmek istiyor musun?")) {
                showScreen('level-screen'); 
            }
        }
    }

    function openInspectScreen() {
        showScreen('inspect-screen');
        
        document.getElementById('insp-score').innerText = score;
        document.getElementById('insp-correct').innerText = correctCount;
        document.getElementById('insp-wrong').innerText = wrongCount;
        document.getElementById('insp-level-title').innerText = currentLevel;
        
        let suffix = [1, 2, 3, 4, 5, 7, 8].includes(currentLevel) ? "'ler" : "'lar";
        document.getElementById('insp-level-suffix').innerText = suffix;

        const listDiv = document.getElementById('table-list');
        listDiv.innerHTML = "";

        let col1 = document.createElement('div');
        col1.className = "table-column";
        let col2 = document.createElement('div');
        col2.className = "table-column";

        for(let i = 1; i <= 10; i++) {
            let div = document.createElement('div');
            div.className = "table-row";
            
            let statusHTML = "";
            let rowClass = "row-unanswered";

            if (historyData[i] === 'correct') {
                statusHTML = "✔ ";
                rowClass = "row-correct";
            } else if (historyData[i] === 'wrong') {
                statusHTML = "✖ ";
                rowClass = "row-wrong";
            } else {
                statusHTML = "<span style='opacity:0;'>✔ </span>"; 
            }

            div.innerHTML = `<span class="${rowClass}">${statusHTML} ${currentLevel} x ${i} = ${currentLevel * i}</span>`;
            
            if (i <= 5) {
                col1.appendChild(div);
            } else {
                col2.appendChild(div);
            }
        }
        listDiv.appendChild(col1);
        listDiv.appendChild(col2);
    }

    function closeInspectScreen() {
        showScreen('game-screen');
        if (needsNewQuestion) {
            generateQuestion();
            needsNewQuestion = false;
        } 
    }

    function startMistakeMode() {
        mistakeQueue = [];
        for (let i = 1; i <= 10; i++) {
            if (historyData[i] === 'wrong') mistakeQueue.push(i);
        }
        if (mistakeQueue.length === 0) {
            alert("Harika! Hiç yanlışınız yok.");
            return;
        }
        isMistakeMode = true;
        showScreen('game-screen');
        generateQuestion();
    }
</script>
</body>
</html>
